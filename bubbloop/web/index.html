<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a1f5c">
<title>Bubbloop</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="sky" aria-hidden="true">
  <div class="stars"></div>
  <div class="glow g1"></div><div class="glow g2"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
</div>

<div id="app" hidden>
  <header id="top">
    <button id="btn-project" class="pill grow" aria-label="Song menu"><span class="ico" data-ico="menu"></span><span id="project-name">Song</span></button>
    <button id="btn-tempo" class="pill" aria-label="Tempo"><span class="ico" data-ico="heart"></span><span id="tempo-label">92</span></button>
    <button id="btn-key" class="pill" aria-label="Key and scale"><span class="ico" data-ico="note"></span><span id="key-label">C major</span></button>
    <button id="btn-export" class="pill round" aria-label="Export"><span class="ico" data-ico="share"></span></button>
  </header>

  <section id="transport">
    <div id="sections" class="scroll-x"></div>
    <button id="btn-bars" class="pill small" aria-label="Loop length">2 bars</button>
    <button id="btn-undo" class="pill round small" aria-label="Undo"><span class="ico" data-ico="undo"></span></button>
    <button id="btn-play" class="big-btn play" aria-label="Play"><span class="ico" data-ico="play"></span></button>
    <button id="btn-rec" class="big-btn rec" aria-label="Record"><span class="dot"></span></button>
  </section>

  <div id="loopwrap">
    <canvas id="loopmap"></canvas>
    <div id="count"></div>
    <div id="hint"></div>
  </div>

  <nav id="tracks" class="scroll-x"></nav>
  <div id="tools" class="scroll-x"></div>
  <div id="steps" hidden></div>

  <main id="stage">
    <div id="grid" class="view"></div>
    <div id="fxview" class="view" hidden></div>
    <div id="mixview" class="view" hidden></div>
    <div id="songview" class="view" hidden></div>
  </main>

  <nav id="tabs">
    <button data-view="play" class="tab on"><span class="ico" data-ico="bubbles"></span><b>Play</b></button>
    <button data-view="fx" class="tab"><span class="ico" data-ico="sparkle"></span><b>FX</b></button>
    <button data-view="mix" class="tab"><span class="ico" data-ico="sliders"></span><b>Mix</b></button>
    <button data-view="song" class="tab"><span class="ico" data-ico="song"></span><b>Song</b></button>
  </nav>
</div>

<div id="splash">
  <div class="logo">
    <div class="logo-bubbles" id="logo-bubbles"></div>
    <h1>Bubbloop</h1>
    <p>pocket beats made of bubbles</p>
  </div>
  <button id="btn-start" class="start">tap to play</button>
  <p id="old-msg" hidden>Bubbloop needs a newer web engine than this phone has. Update <b>Android System WebView</b> (or Chrome) in the Play Store, then open Bubbloop again.</p>
</div>

<div id="scrim" hidden></div>
<div id="sheet" hidden role="dialog" aria-modal="true"><div class="grab"></div><div id="sheet-body"></div></div>
<canvas id="particles" aria-hidden="true"></canvas>
<div id="toast" hidden></div>

<script type="module" src="js/ui/app.js"></script>
<script>
  // If the app has not come to life after a few seconds, the system WebView
  // is too old to run it. Say so, rather than leaving a button that does nothing.
  setTimeout(function () {
    if (window.bubbloop) return;
    document.getElementById('btn-start').hidden = true;
    document.getElementById('old-msg').hidden = false;
  }, 5000);
</script>
</body>
</html>

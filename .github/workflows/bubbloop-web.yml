name: Boba Beats web

# Publishes Boba Beats (bubbloop/web) as a web page with GitHub Pages whenever bubbloop/web
# changes on main, or when triggered by hand.
on:
  push:
    branches:
      - main
    paths:
      - 'bubbloop/web/**'
      - '.github/workflows/bubbloop-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh the offline file list
        run: node bubbloop/tools/make-web.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: bubbloop/web
      - id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#030716">
<title>Deep Drift</title>
<style>
@font-face { font-family: 'Fredoka'; font-weight: 400; font-display: swap; src: url('fonts/fredoka-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'Fredoka'; font-weight: 600; font-display: swap; src: url('fonts/fredoka-latin-600-normal.woff2') format('woff2'); }
:root { --ink: #cfe3ff; --dim: rgba(207, 227, 255, .55); --glass: rgba(140, 190, 255, .08); --line: rgba(160, 205, 255, .16);
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #030716; color: var(--ink); font-family: 'Fredoka', ui-rounded, system-ui, sans-serif;
  user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
#sea { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
#top { position: fixed; left: 0; right: 0; top: 0; padding: calc(var(--safe-t) + 12px) 16px 0; display: flex; align-items: center; gap: 8px; pointer-events: none; }
#top h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: .02em; flex: 1; opacity: .75; }
.chip { pointer-events: auto; height: 36px; padding: 0 14px; border-radius: 18px; background: var(--glass); border: 1px solid var(--line); font-size: 14px; font-weight: 600; color: var(--ink); }
.chip.on { background: rgba(150, 210, 255, .22); border-color: rgba(170, 220, 255, .5); }
#panel { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 14px calc(var(--safe-b) + 14px); background: linear-gradient(transparent, rgba(2, 5, 16, .85) 30%); }
.row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
.sl { display: grid; grid-template-columns: 58px 1fr; align-items: center; gap: 8px; max-width: 460px; margin: 0 auto 6px; font-size: 13px; font-weight: 600; color: var(--dim); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: none; margin: 0; touch-action: none; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -8px; border-radius: 50%; background: #bfe3ff; box-shadow: 0 0 14px rgba(140, 210, 255, .8); }
input[type=range]::-moz-range-track { height: 4px; background: var(--line); }
input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border: 0; border-radius: 50%; background: #bfe3ff; }
#start { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: grid; place-items: center; text-align: center; background: rgba(3, 7, 22, .7); transition: opacity .8s; z-index: 5; }
#start.gone { opacity: 0; pointer-events: none; }
#start h2 { margin: 0 0 6px; font-size: 40px; font-weight: 600; }
#start p { margin: 0 0 26px; color: var(--dim); }
#start button { padding: 14px 30px; border-radius: 28px; font-size: 18px; font-weight: 600; background: rgba(150, 210, 255, .16); border: 1px solid rgba(170, 220, 255, .45); box-shadow: 0 0 30px rgba(120, 190, 255, .25); }
#toast { position: fixed; left: 50%; top: calc(var(--safe-t) + 60px); transform: translateX(-50%); font-size: 14px; color: var(--dim); opacity: 0; transition: opacity .5s; pointer-events: none; }
#toast.on { opacity: 1; }
</style>
</head>
<body>
<canvas id="sea"></canvas>
<header id="top">
  <h1>Deep Drift</h1>
  <button class="chip" id="mood">Deep</button>
  <button class="chip" id="timer">sleep: off</button>
</header>
<div id="toast"></div>
<section id="panel">
  <div class="row" id="voices"></div>
  <label class="sl"><span>Depth</span><input type="range" id="depth" min="0" max="100" value="50"></label>
  <label class="sl"><span>Tide</span><input type="range" id="tide" min="0" max="100" value="50"></label>
  <label class="sl"><span>Tape</span><input type="range" id="tape" min="0" max="100" value="30"></label>
  <div class="row" style="margin: 8px 0 0">
    <button class="chip" id="animate">✦ Animate</button>
    <button class="chip" id="hum">Hum: off</button>
  </div>
</section>
<div id="start"><div><h2>Deep Drift</h2><p>tap the sleepy lights. hold one to hum.</p><button id="go">dive in</button></div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
